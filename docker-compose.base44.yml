name: the-one

services:
  web:
    image: node:22
    working_dir: /app
    # Dependencies live in a named volume, so they are installed from the
    # committed lockfile on every start rather than baked into an image.
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      # Sandbox preview plumbing: passed through from the platform environment
      # (never hardcoded here). BASE44_PREVIEW_MODE gates the Vite host/HMR
      # config in vite.config.js.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

volumes:
  node_modules:
